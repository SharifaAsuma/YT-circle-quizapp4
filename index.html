<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホ対応 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IT部 ○×クイズ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Meiryo", "Yu Gothic", sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quiz-container {
            width: 92%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #333;
            font-size: 28px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .timer {
            color: #e53935;
        }

        .question {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 25px 20px;
            margin-bottom: 25px;
            font-size: 20px;
            line-height: 1.7;
            text-align: left;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            width: 120px;
            height: 80px;
            border: none;
            border-radius: 15px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .true-btn {
            background-color: #42a5f5;
        }

        .false-btn {
            background-color: #ef5350;
        }

        .result {
            display: none;
        }

        .result-title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .explanation {
            background: #fff8e1;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .next-btn {
            width: 200px;
            height: 55px;
            font-size: 18px;
            background-color: #66bb6a;
        }

        .final-score {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
        }

        .restart-btn {
            width: 220px;
            height: 55px;
            font-size: 18px;
            background-color: #7e57c2;
        }

        @media (max-width: 480px) {

            .quiz-container {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }

            .question {
                font-size: 17px;
            }

            button {
                width: 100px;
                height: 70px;
            }

            .buttons {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1>💻 IT部 ○×クイズ</h1>

    <!-- クイズ画面 -->
    <div id="quiz-screen">

        <div class="status">
            <span id="count">1 / 8</span>
            <span class="timer">
                ⏱ <span id="timer">60</span>秒
            </span>
        </div>

        <div class="question" id="question">
        </div>

        <div class="buttons">
            <button class="true-btn"
                    onclick="answer(true)">
                ⭕
            </button>

            <button class="false-btn"
                    onclick="answer(false)">
                ❌
            </button>
        </div>

    </div>


    <!-- 回答結果画面 -->
    <div id="result-screen" class="result">

        <div id="result-title"
             class="result-title">
        </div>

        <div class="explanation">
            <strong>【解説】</strong>

            <p id="explanation"></p>
        </div>

        <button class="next-btn"
                onclick="nextQuestion()">
            次の問題 →
        </button>

    </div>


    <!-- 最終結果画面 -->
    <div id="final-screen"
         class="result">

        <h2>🎉 クイズ終了！</h2>

        <div class="final-score"
             id="final-score">
        </div>

        <button class="restart-btn"
                onclick="restartQuiz()">
            もう一度挑戦
        </button>

    </div>

</div>


<script>

    // =============================
    // 問題データ
    // =============================

    const questions = [

        {
            question:
                "Q1. バドミントンのシャトル（羽根）は、本物の鳥の羽根で作ることが国際的に禁止されている。",

            answer: false,

            explanation:
                "本物の鳥の羽根（主にガチョウやアヒル）で作られたシャトルは国際大会でも正式に認められています。"
        },

        {
            question:
                "Q2. バドミントンはもともとインドで競技化されたスポーツである。",

            answer: false,

            explanation:
                "発祥はイギリス。インドの遊び『プーナ』をもとに競技化されました。"
        },

        {
            question:
                "Q3. マラソンの距離42.195kmは、ギリシャのマラトンからアテネまでの距離に由来する。",

            answer: true,

            explanation:
                "紀元前490年の伝令が由来とされています。"
        },

        {
            question:
                "Q4. 陸上競技の400mハードルで、男子のハードルの高さは91.4cmである。",

            answer: true,

            explanation:
                "男子91.4cm、女子76.2cmです。"
        },

        {
            question:
                "Q5. USBの正式名称は『Universal Serial Bus』である。",

            answer: true,

            explanation:
                "その通りです。USBはUniversal Serial Busの略です。"
        },

        {
            question:
                "Q6. HDDとSSDの違いは、HDDはディスク、SSDはメモリを使っている点である。",

            answer: true,

            explanation:
                "SSDはフラッシュメモリを使ってデータを保存するため、HDDより高速に動作します。"
        },

        {
            question:
                "Q7. 日本の郵便番号は7桁で、最初の3桁が都道府県を表している。",

            answer: false,

            explanation:
                "郵便番号は7桁ですが、最初の3桁が都道府県を表すわけではありません。"
        },

        {
            question:
                "Q8. 宇宙空間は絶対零度（-273.15℃）である。",

            answer: false,

            explanation:
                "宇宙空間は約-270℃（約3K）で、絶対零度そのものではありません。"
        }

    ];


    // =============================
    // 変数
    // =============================

    let current = 0;

    let score = 0;

    let timeLeft = 60;

    let timer;


    // =============================
    // 問題表示
    // =============================

    function showQuestion() {

        document.getElementById("quiz-screen")
            .style.display = "block";

        document.getElementById("result-screen")
            .style.display = "none";

        document.getElementById("final-screen")
            .style.display = "none";


        document.getElementById("question")
            .textContent =
            questions[current].question;


        document.getElementById("count")
            .textContent =
            `${current + 1} / ${questions.length}`;


        // タイマーリセット
        startTimer();
    }


    // =============================
    // タイマー
    // =============================

    function startTimer() {

        clearInterval(timer);

        timeLeft = 60;

        document.getElementById("timer")
            .textContent = timeLeft;


        timer = setInterval(function() {

            timeLeft--;

            document.getElementById("timer")
                .textContent = timeLeft;


            if (timeLeft <= 0) {

                clearInterval(timer);

                // 時間切れ
                showTimeUp();
            }

        }, 1000);
    }


    // =============================
    // 時間切れ
    // =============================

    function showTimeUp() {

        document.getElementById("quiz-screen")
            .style.display = "none";

        document.getElementById("result-screen")
            .style.display = "block";


        document.getElementById("result-title")
            .textContent = "⏰ 時間切れ！";


        document.getElementById("explanation")
            .textContent =
            "時間内に回答できませんでした。";


        document.querySelector(".next-btn")
            .textContent =
            current === questions.length - 1
                ? "結果を見る"
                : "次の問題 →";
    }


    // =============================
    // 回答
    // =============================

    function answer(choice) {

        clearInterval(timer);


        const q = questions[current];


        if (choice === q.answer) {

            score++;

            document.getElementById("result-title")
                .textContent = "⭕ 正解！";

        } else {

            document.getElementById("result-title")
                .textContent = "❌ 不正解";
        }


        document.getElementById("explanation")
            .textContent = q.explanation;


        document.getElementById("quiz-screen")
            .style.display = "none";

        document.getElementById("result-screen")
            .style.display = "block";


        document.querySelector(".next-btn")
            .textContent =
            current === questions.length - 1
                ? "結果を見る"
                : "次の問題 →";
    }


    // =============================
    // 次の問題
    // =============================

    function nextQuestion() {

        current++;


        if (current < questions.length) {

            showQuestion();

        } else {

            showFinalResult();
        }
    }


    // =============================
    // 最終結果
    // =============================

    function showFinalResult() {

        clearInterval(timer);


        document.getElementById("quiz-screen")
            .style.display = "none";

        document.getElementById("result-screen")
            .style.display = "none";

        document.getElementById("final-screen")
            .style.display = "block";


        document.getElementById("final-score")
            .textContent =
            `${questions.length}問中 ${score}問正解！`;
    }


    // =============================
    // リスタート
    // =============================

    function restartQuiz() {

        current = 0;

        score = 0;

        showQuestion();
    }


    // =============================
    // 最初の問題
    // =============================

    showQuestion();

</script>

</body>
</html>
